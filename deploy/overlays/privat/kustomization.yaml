# The private instance: behind Cloudflare Access, the personal greeting is shown, original limits.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ingress.yaml
patches:
  - target: {kind: Deployment, name: kurs}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: KURS_LAGE, value: privat}
