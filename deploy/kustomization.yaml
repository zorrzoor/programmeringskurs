# Entry point for the private instance (kurs.feuerliden.se): the platform's tenant `programmeringskurs` applies the artifact's
# root. The public instance (kursen.feuerliden.se) uses path ./overlays/publik in its tenant. CI publishes this whole
# directory as ONE OCI artifact (ghcr.io/zorrzoor/programmeringskurs-manifests, sha-<7> and main) pinned to the image.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - overlays/privat
