# TLS Traefik -> pod: certificate from the cluster's internal CA for the Service name. The server reads
# it again every 12 hours, so a renewal needs no restart.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kurs-tls
spec:
  secretName: kurs-tls
  dnsNames:
    - kurs.programmeringskurs.svc
    - kurs.programmeringskurs.svc.cluster.local
  duration: 2160h # 90 days
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    kind: ClusterIssuer
    name: internal-ca
