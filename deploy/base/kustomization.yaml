# Common part of the instances (overlays/privat, overlays/publik). Namespace-dependent names (certificate, ServersTransport, the
# Service annotation) have the private values here; overlays/publik patches them. Image pinning by CI is done here.
# Manifests for the cluster. CI publishes this directory as the OCI artifact
# ghcr.io/zorrzoor/programmeringskurs-manifests (sha-<7> and main); the platform (k3s_hosting) applies it in
# the namespace programmeringskurs. Contract: k3s_hosting docs/tenants.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: programmeringskurs
resources:
  - certificate.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - serverstransport.yaml
images:
  # CI pins the published artifact to the image it just pushed (sha-<7>).
  - name: ghcr.io/zorrzoor/programmeringskurs
    newTag: latest
